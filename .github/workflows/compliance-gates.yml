name: Compliance Gates (Reusable)

# Adopt the full pipeline from your own repo:
#
#   jobs:
#     compliance:
#       uses: MohamedMubarak123/gitops-compliant-ai/.github/workflows/compliance-gates.yml@v1
#       with:
#         data-path: ./data
#         model-cards-path: ./model_cards
#         terraform-paths: "infra/*.tf"
#
# Every gate is opt-in: leave an input empty and that gate is skipped.
# A gate that runs but finds nothing to check fails as misconfigured
# rather than reporting success — set the matching allow-empty input
# if scanning nothing is genuinely expected.

on:
  workflow_call:
    inputs:
      data-path:
        description: "CSV file or directory to scan for PII"
        type: string
        required: false
        default: ""
      model-cards-path:
        description: "Model card file or directory to validate"
        type: string
        required: false
        default: ""
      terraform-paths:
        description: "Space-separated Terraform files/globs to enforce policies against"
        type: string
        required: false
        default: ""
      config:
        description: "Path to your compliance.config.yml"
        type: string
        required: false
        default: ""
      allow-empty:
        description: "Treat 'nothing found to check' as a pass instead of a misconfiguration"
        type: boolean
        required: false
        default: false
      python-version:
        description: "Python version used to run the gates"
        type: string
        required: false
        default: "3.11"
      evidence-retention-days:
        description: "How long to retain the evidence pack artifact"
        type: number
        required: false
        default: 90

permissions:
  contents: read

jobs:
  gates:
    name: "🔍 Compliance Gates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: PII Scan (POL-PRIV-001)
        if: inputs.data-path != ''
        uses: MohamedMubarak123/gitops-compliant-ai/.github/actions/pii-scan@v1
        with:
          path: ${{ inputs.data-path }}
          config: ${{ inputs.config }}
          allow-empty: ${{ inputs.allow-empty }}

      - name: Model Card Validation (POL-GOV-002)
        if: inputs.model-cards-path != ''
        uses: MohamedMubarak123/gitops-compliant-ai/.github/actions/model-card-check@v1
        with:
          path: ${{ inputs.model-cards-path }}
          config: ${{ inputs.config }}
          allow-empty: ${{ inputs.allow-empty }}

      - name: Infrastructure Policy Enforcement (POL-PRIV/SEC)
        if: inputs.terraform-paths != ''
        uses: MohamedMubarak123/gitops-compliant-ai/.github/actions/policy-check@v1
        with:
          terraform-paths: ${{ inputs.terraform-paths }}

      # Runs even when a gate above failed: the evidence pack records what
      # was checked and what was not, which is exactly what an auditor needs
      # from a failed run.
      - name: Evidence Pack (POL-GOV-003)
        if: always()
        uses: MohamedMubarak123/gitops-compliant-ai/.github/actions/evidence-pack@v1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-pack
          path: evidence/
          retention-days: ${{ inputs.evidence-retention-days }}
