name: "Model Card Validation (EU AI Act)"
description: "Validates model cards against EU AI Act Annex IV, UAE PDPL and GDPR documentation requirements. Implements POL-GOV-002."
branding:
  icon: file-text
  color: blue
inputs:
  path:
    description: "Model card file or directory (directories are searched recursively)"
    required: true
  config:
    description: "Optional compliance.config.yml with a custom schema"
    required: false
    default: ""
  output-file:
    description: "Where to write the JSON report (consumed by the evidence-pack action)"
    required: false
    default: "reports/model_cards.json"
  allow-empty:
    description: "Pass when no model cards are found instead of failing as misconfigured"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      # requirements.txt is used as a constraints file: this gate only needs
      # pyyaml, but the version still comes from the project's declaration
      # instead of whatever happens to be newest that day.
      env:
        REQUIREMENTS: ${{ github.action_path }}/../../../requirements.txt
      run: |
        set -euo pipefail
        pip install --quiet -c "$REQUIREMENTS" pyyaml
    - name: Validate model cards
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_ALLOW_EMPTY: ${{ inputs.allow-empty }}
        VALIDATOR: ${{ github.action_path }}/../../../scripts/model_card_validator.py
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$INPUT_OUTPUT_FILE")"
        ARGS=(--path "$INPUT_PATH" --output-format github --output-file "$INPUT_OUTPUT_FILE")
        if [ -n "$INPUT_CONFIG" ]; then
          ARGS+=(--config "$INPUT_CONFIG")
        fi
        if [ "$INPUT_ALLOW_EMPTY" = "true" ]; then
          ARGS+=(--allow-empty)
        fi
        python "$VALIDATOR" "${ARGS[@]}"
