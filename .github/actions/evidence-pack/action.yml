name: "Compliance Evidence Pack"
description: "Aggregates gate results into an auditor-facing, commit-pinned artifact. Implements POL-GOV-003 / GDPR Art. 5(2) / EU AI Act Art. 12."
branding:
  icon: package
  color: green
inputs:
  pii-report:
    description: "Path to the PII scan JSON report"
    required: false
    default: "reports/pii_scan.json"
  model-card-report:
    description: "Path to the model card JSON report"
    required: false
    default: "reports/model_cards.json"
  conftest-report:
    description: "Path to the conftest JSON report"
    required: false
    default: "reports/conftest.json"
  policy-mapping:
    description: "Path to the policy register YAML (defaults to this repo's register)"
    required: false
    default: ""
  output-dir:
    description: "Directory to write evidence_pack.json / .md"
    required: false
    default: "evidence"
  fail-on-violation:
    description: "Fail this step when the overall result is not PASS (the gates themselves already fail the build)"
    required: false
    default: "false"
outputs:
  content-digest:
    description: "sha256 of the generated pack. Feed it to actions/attest-build-provenance to turn the pack's own checksum into signed, verifiable provenance."
    value: ${{ steps.digest.outputs.content-digest }}
  overall-result:
    description: "PASS, PARTIAL or FAIL"
    value: ${{ steps.digest.outputs.overall-result }}
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      # requirements.txt is used as a constraints file: this gate only needs
      # pyyaml, but the version still comes from the project's declaration
      # instead of whatever happens to be newest that day.
      env:
        REQUIREMENTS: ${{ github.action_path }}/../../../requirements.txt
      run: |
        set -euo pipefail
        pip install --quiet -c "$REQUIREMENTS" pyyaml
    - name: Generate evidence pack
      shell: bash
      env:
        INPUT_PII_REPORT: ${{ inputs.pii-report }}
        INPUT_MODEL_CARD_REPORT: ${{ inputs.model-card-report }}
        INPUT_CONFTEST_REPORT: ${{ inputs.conftest-report }}
        INPUT_POLICY_MAPPING: ${{ inputs.policy-mapping }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_FAIL_ON_VIOLATION: ${{ inputs.fail-on-violation }}
        GENERATOR: ${{ github.action_path }}/../../../scripts/generate_evidence_pack.py
        DEFAULT_MAPPING: ${{ github.action_path }}/../../../templates/policy_mapping.yml
      run: |
        set -euo pipefail
        MAPPING="$INPUT_POLICY_MAPPING"
        if [ -z "$MAPPING" ]; then
          MAPPING="$DEFAULT_MAPPING"
        fi
        ARGS=(
          --pii-report "$INPUT_PII_REPORT"
          --model-card-report "$INPUT_MODEL_CARD_REPORT"
          --conftest-report "$INPUT_CONFTEST_REPORT"
          --policy-mapping "$MAPPING"
          --output-dir "$INPUT_OUTPUT_DIR"
        )
        if [ "$INPUT_FAIL_ON_VIOLATION" = "true" ]; then
          ARGS+=(--fail-on-violation)
        fi
        python "$GENERATOR" "${ARGS[@]}"
    - name: Verify and expose the pack digest
      id: digest
      shell: bash
      # Re-reads what was just written and checks it against its own recorded
      # digest, so a truncated or half-written pack is caught here rather than
      # by the auditor who eventually opens it.
      env:
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        GENERATOR: ${{ github.action_path }}/../../../scripts/generate_evidence_pack.py
      run: |
        set -euo pipefail
        PACK="$INPUT_OUTPUT_DIR/evidence_pack.json"
        python "$GENERATOR" --verify "$PACK"
        python - "$PACK" >> "$GITHUB_OUTPUT" <<'PY'
        import json, sys
        pack = json.load(open(sys.argv[1]))
        print(f"content-digest={pack['integrity']['content_digest']}")
        print(f"overall-result={pack['overall_result']}")
        PY
    - name: Publish job summary
      shell: bash
      env:
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        SUMMARY="$INPUT_OUTPUT_DIR/evidence_pack.md"
        if [ -f "$SUMMARY" ]; then
          cat "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::warning title=Evidence Pack::no summary written at ${SUMMARY}"
        fi
