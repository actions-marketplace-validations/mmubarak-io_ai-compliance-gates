name: "PII Scan (UAE-aware)"
description: "Blocks datasets containing PII, including UAE-specific patterns (Emirates ID, +971 phones, AE IBAN). Implements POL-PRIV-001 / UAE PDPL Art. 20 / GDPR Art. 32."
branding:
  icon: shield
  color: red
inputs:
  path:
    description: "File or directory to scan (directories are searched recursively). Reads CSV, TSV, JSON, JSON Lines and Parquet, including compressed variants."
    required: true
  config:
    description: "Optional compliance.config.yml to extend/override patterns"
    required: false
    default: ""
  output-file:
    description: "Where to write the JSON report (consumed by the evidence-pack action)"
    required: false
    default: "reports/pii_scan.json"
  allow-empty:
    description: "Pass when no readable data files are found instead of failing as misconfigured"
    required: false
    default: "false"
  allow-unscanned:
    description: "Continue when the target holds data files the scanner cannot read (a .xlsx, say). The gap stays recorded in the report and marks the evidence pack PARTIAL."
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      # Installs from this repo's requirements.txt rather than bare package
      # names, so the versions a gate runs against are the ones the project
      # declares and tests. A bare `pip install pandas` silently drifts.
      env:
        REQUIREMENTS: ${{ github.action_path }}/../../../requirements.txt
      run: |
        set -euo pipefail
        pip install --quiet -r "$REQUIREMENTS"
    - name: Scan for PII
      shell: bash
      # Inputs are passed through env rather than interpolated into the script
      # body, so a value containing shell metacharacters is data, not code.
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_ALLOW_EMPTY: ${{ inputs.allow-empty }}
        INPUT_ALLOW_UNSCANNED: ${{ inputs.allow-unscanned }}
        SCANNER: ${{ github.action_path }}/../../../scripts/pii_scanner.py
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$INPUT_OUTPUT_FILE")"
        ARGS=(--path "$INPUT_PATH" --output-format github --output-file "$INPUT_OUTPUT_FILE")
        if [ -n "$INPUT_CONFIG" ]; then
          ARGS+=(--config "$INPUT_CONFIG")
        fi
        if [ "$INPUT_ALLOW_EMPTY" = "true" ]; then
          ARGS+=(--allow-empty)
        fi
        if [ "$INPUT_ALLOW_UNSCANNED" = "true" ]; then
          ARGS+=(--allow-unscanned)
        fi
        python "$SCANNER" "${ARGS[@]}"
