name: "PII Scan (UAE-aware)"
description: "Blocks datasets containing PII, including UAE-specific patterns (Emirates ID, +971 phones, AE IBAN). Implements POL-PRIV-001 / UAE PDPL Art. 20 / GDPR Art. 32."
branding:
  icon: shield
  color: red
inputs:
  path:
    description: "File or directory of CSVs to scan (directories are searched recursively)"
    required: true
  config:
    description: "Optional compliance.config.yml to extend/override patterns"
    required: false
    default: ""
  output-file:
    description: "Where to write the JSON report (consumed by the evidence-pack action)"
    required: false
    default: "reports/pii_scan.json"
  allow-empty:
    description: "Pass when no CSV files are found instead of failing as misconfigured"
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        pip install --quiet pandas pyyaml
    - name: Scan for PII
      shell: bash
      # Inputs are passed through env rather than interpolated into the script
      # body, so a value containing shell metacharacters is data, not code.
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_OUTPUT_FILE: ${{ inputs.output-file }}
        INPUT_ALLOW_EMPTY: ${{ inputs.allow-empty }}
        SCANNER: ${{ github.action_path }}/../../../scripts/pii_scanner.py
      run: |
        set -euo pipefail
        mkdir -p "$(dirname "$INPUT_OUTPUT_FILE")"
        ARGS=(--path "$INPUT_PATH" --output-format github --output-file "$INPUT_OUTPUT_FILE")
        if [ -n "$INPUT_CONFIG" ]; then
          ARGS+=(--config "$INPUT_CONFIG")
        fi
        if [ "$INPUT_ALLOW_EMPTY" = "true" ]; then
          ARGS+=(--allow-empty)
        fi
        python "$SCANNER" "${ARGS[@]}"
