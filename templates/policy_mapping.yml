policies:
  - policy_id: "POL-PRIV-001"
    name: "Data Protection"
    azure: "min_tls_version = TLS1_2"
  - policy_id: "POL-PRIV-006"
    name: "Data Retention"
    azure: "delete_after_days = 90"
  - policy_id: "POL-PRIV-007"
    name: "Data Residency"
    azure: "location = uaenorth"
  - policy_id: "POL-SEC-001"
    name: "Information Security"
    azure: "public_network_access_enabled = false"
  - policy_id: "POL-PRIV-010"
    name: "Audit Logging"
    azure: "azurerm_monitor_diagnostic_setting"
