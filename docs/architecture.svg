    <path d="M378,387 L450,415" stroke-dasharray="3 3" marker-end="url(#filled)"/>
    <path d="M576,387 L505,415" stroke-dasharray="3 3" marker-end="url(#filled)"/>
    <path d="M774,387 L540,415" stroke-dasharray="3 3" marker-end="url(#filled)"/>
